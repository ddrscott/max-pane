[package]
name = "laned-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Durable ledger, ordinals, tagging, search and eviction policy for Max Pane. Platform-agnostic."

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "laned_core"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
ulid = "1"
# Chromium keeps its bookmarks as JSON rather than in the SQLite file next to
# it, and it is the one format in this crate SQLite cannot read for us.
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
