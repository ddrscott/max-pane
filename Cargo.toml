[workspace]
resolver = "2"
members = ["crates/laned-core", "crates/maxpane-open"]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
# Deliberately NOT panic = "abort". uniffi wraps every exported call in
# catch_unwind so a Rust panic arrives in Swift as an error the app can show and
# survive; aborting would take the whole strip down instead, which is the one
# thing this design exists to prevent.
